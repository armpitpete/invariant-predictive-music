name: render-study-006

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ipm/bar_rhythm.py"
      - "src/ipm/study6.py"
      - "src/ipm/study5.py"
      - ".github/workflows/render-study-006.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Generate Study 006
        run: python -m ipm.study6 --output artifacts
      - name: Upload Study 006
        uses: actions/upload-artifact@v7
        with:
          name: ipm-study-006
          path: artifacts/
          if-no-files-found: error
