name: diagnose-listening-controls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/diagnose_listening_controls.py"
      - "src/ipm/experiment.py"
      - "src/ipm/engine.py"
      - ".github/workflows/diagnose-listening-controls.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install IPM
        run: python -m pip install -e '.[dev]'
      - name: Audit control attrition
        run: python scripts/diagnose_listening_controls.py
