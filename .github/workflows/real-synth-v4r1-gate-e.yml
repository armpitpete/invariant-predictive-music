name: RealSynthEngine v4R1 R-E

on:
  workflow_dispatch:

jobs:
  evolution-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-synth-v4r1-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Materialise frozen STATIC/EVOLVING package
        run: python scripts/render_real_synth_v4r1_gate_e.py
      - name: Verify pair and automation ledger
        run: |
          test -s real-synth-engine-v4r1-gate-e/STATIC.wav
          test -s real-synth-engine-v4r1-gate-e/EVOLVING.wav
          test -s real-synth-engine-v4r1-gate-e/automation-ledger.json
          test -s real-synth-engine-v4r1-gate-e/acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: ipm-real-synth-engine-v4r1-gate-e
          path: real-synth-engine-v4r1-gate-e/
          if-no-files-found: error
