name: render-study-008

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ipm/sequential_bar.py"
      - "src/ipm/study8.py"
      - ".github/workflows/render-study-008.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .
      - name: Generate Study 008
        run: python -m ipm.study8 --output artifacts
      - name: Upload Study 008
        uses: actions/upload-artifact@v7
        with:
          name: ipm-study-008
          path: artifacts/
