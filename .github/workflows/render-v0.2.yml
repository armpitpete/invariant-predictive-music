name: render-v0.2

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/ipm/engine.py'
      - 'src/ipm/lanes.py'
      - 'src/ipm/sequential_bar.py'
      - 'src/ipm/micro_rhythm.py'
      - 'src/ipm/patterns.py'
      - 'src/ipm/sonority.py'
      - 'src/ipm/model.py'
      - 'src/ipm/midi.py'
      - '.github/workflows/render-v0.2.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e .
      - name: Generate current IPM instrument
        run: python -m ipm.engine --output out
      - name: Upload v0.2 artefact
        uses: actions/upload-artifact@v6
        with:
          name: ipm-v0.2
          path: |
            out/ipm-v0.2.mid
            out/ipm-v0.2.trace.json
