name: render-study-004

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ipm/study4.py"
      - "src/ipm/rhythm.py"
      - "src/ipm/study3.py"
      - "src/ipm/study2.py"
      - ".github/workflows/render-study-004.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Generate Study 004
        run: python -m ipm.study4 --output artifacts
      - name: Upload Study 004
        uses: actions/upload-artifact@v7
        with:
          name: ipm-study-004
          path: artifacts/
          if-no-files-found: error
