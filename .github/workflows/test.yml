name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest

  synth-sound-acceptance:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/synth-sound-acceptance-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Render frozen audition set
        run: python scripts/render_synth_sound_acceptance.py
      - name: Verify four WAVs and manifest
        run: |
          test -s synth-sound-acceptance-v1/01-tune-solo.wav
          test -s synth-sound-acceptance-v1/02-bass-solo.wav
          test -s synth-sound-acceptance-v1/03-rhythm-solo.wav
          test -s synth-sound-acceptance-v1/04-full-mix.wav
          test -s synth-sound-acceptance-v1/acceptance.json
      - uses: actions/upload-artifact@v6
        with:
          name: ipm-synth-sound-acceptance-v1
          path: synth-sound-acceptance-v1/
          if-no-files-found: error

  synth-simple-material-interest-v2:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/synth-sound-acceptance-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Render frozen v2 Tune stress test
        run: python scripts/render_synth_sound_interest_v2.py
      - name: Verify Tune WAV and manifest
        run: |
          test -s synth-simple-material-interest-v2/01-tune-solo.wav
          test -s synth-simple-material-interest-v2/acceptance.json
      - uses: actions/upload-artifact@v6
        with:
          name: ipm-synth-simple-material-interest-v2
          path: synth-simple-material-interest-v2/
          if-no-files-found: error
