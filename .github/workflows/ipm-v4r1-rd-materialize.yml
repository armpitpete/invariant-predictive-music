name: IPM v4R1 R-D materialise frozen audition

on:
  push:
    branches:
      - real-synth-v4r1-redesign
    paths:
      - .github/workflows/ipm-v4r1-rd-materialize.yml

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-synth-v4r1-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify frozen v4R1 package and materialise R-D
        run: python scripts/render_real_synth_v4r1_gate_d.py
      - name: Verify R-D package is unjudged and source-frozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('real-synth-engine-v4r1-gate-d/acceptance.json')
          d = json.loads(p.read_text())
          assert d['status'] == 'READY_FOR_R_D_AUDITION_NOT_JUDGED'
          assert d['package_freeze_head'] == 'a2046134731cfe579a571a1c1a0d51389a105afa'
          assert d['human_audition_performed'] is False
          assert d['judgments'] == {}
          print('R-D frozen audition package verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ipm-real-synth-engine-v4r1-gate-d
          path: real-synth-engine-v4r1-gate-d/
          if-no-files-found: error
