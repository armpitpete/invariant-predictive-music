name: inspect-frozen-deployment-pr

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-frozen-deployment-pr.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print latest push-triggered frozen deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/336951999/runs?event=push&branch=agent%2Fmatched-listening-pilot&per_page=10" \
            > runs.json
          python - <<'PY'
          import json
          runs = json.load(open("runs.json"))["workflow_runs"]
          if not runs:
              raise SystemExit("no push-triggered deploy-frozen-listening-study run found")
          run = runs[0]
          print(json.dumps({
              "run_id": run["id"],
              "run_attempt": run.get("run_attempt", 1),
              "event": run["event"],
              "status": run["status"],
              "conclusion": run.get("conclusion"),
              "head_sha": run["head_sha"],
              "html_url": run["html_url"],
              "created_at": run["created_at"],
              "updated_at": run["updated_at"],
          }, indent=2))
          PY

      - name: Print github-pages environment policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages" \
            > environment.json
          python - <<'PY'
          import json
          item = json.load(open("environment.json"))
          print(json.dumps({
              "name": item.get("name"),
              "protection_rules": item.get("protection_rules"),
              "deployment_branch_policy": item.get("deployment_branch_policy"),
          }, indent=2))
          PY
          policy=$(python -c 'import json; print("true" if (json.load(open("environment.json")).get("deployment_branch_policy") or {}).get("custom_branch_policies") else "false")')
          if [ "$policy" = "true" ]; then
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages/deployment-branch-policies?per_page=100" \
              > policies.json
            cat policies.json
          fi

# v2 deployment inspection refresh
