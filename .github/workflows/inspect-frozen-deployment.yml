name: inspect-frozen-deployment

on:
  push:
    branches:
      - agent/matched-listening-pilot
    paths:
      - ".github/workflows/inspect-frozen-deployment.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest branch-push frozen deployment run
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/336951999/runs?event=push&branch=agent%2Fmatched-listening-pilot&per_page=10"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > runs.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          runs = json.load(open("runs.json"))["workflow_runs"]
          if not runs:
              raise SystemExit("no push-triggered deploy-frozen-listening-study run found")
          run = runs[0]
          print(f"run_id={run['id']}")
          print(f"status={run['status']}")
          print(f"conclusion={run.get('conclusion') or ''}")
          print(f"head_sha={run['head_sha']}")
          print(f"run_attempt={run.get('run_attempt', 1)}")
          print(f"html_url={run['html_url']}")
          PY

      - name: Report exact deployment run on PR 24
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inspect.outputs.run_id }}
          STATUS: ${{ steps.inspect.outputs.status }}
          CONCLUSION: ${{ steps.inspect.outputs.conclusion }}
          HEAD_SHA: ${{ steps.inspect.outputs.head_sha }}
          RUN_ATTEMPT: ${{ steps.inspect.outputs.run_attempt }}
          RUN_URL: ${{ steps.inspect.outputs.html_url }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ### Frozen deployment run inspector

          - push-triggered deployment run: \`${RUN_ID}\` attempt \`${RUN_ATTEMPT}\`
          - deployment workflow head: \`${HEAD_SHA}\`
          - status: **${STATUS}**
          - conclusion: **${CONCLUSION:-pending}**
          - run: ${RUN_URL}

          This is an observability record only; it does not recruit participants or modify the frozen artifact.
          EOF
          )
          payload=$(python -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<<"$body")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/24/comments" \
            --data "$payload"
