name: RealSynthEngine v4 Gate C

on:
  pull_request:

permissions:
  contents: read

jobs:
  blind-preaudition-render:
    if: github.head_ref == 'real-synth-v4-gate-c'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run Gate C preflight tests
        run: python -m pytest tests/v4_gate_c/test_preflight.py
      - name: Render frozen blind Gate C package
        run: python scripts/render_real_synth_v4_gate_c.py
      - name: Verify public/private separation
        run: |
          test -s real-synth-engine-v4-gate-c/blind/blind-1.wav
          test -s real-synth-engine-v4-gate-c/blind/blind-2.wav
          test -s real-synth-engine-v4-gate-c/blind/blind-3.wav
          test -s real-synth-engine-v4-gate-c/acceptance.json
          test -s real-synth-engine-v4-gate-c/README.txt
          test -s real-synth-engine-v4-gate-c-private/mapping.json
          test "$(find real-synth-engine-v4-gate-c/blind -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 3
          ! grep -q '"family"' real-synth-engine-v4-gate-c/acceptance.json
          grep -q 'READY_FOR_BLIND_AUDITION_NOT_JUDGED' real-synth-engine-v4-gate-c/acceptance.json
      - uses: actions/upload-artifact@v6
        with:
          name: ipm-real-synth-engine-v4-gate-c-blind
          path: real-synth-engine-v4-gate-c/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ipm-real-synth-engine-v4-gate-c-private-mapping
          path: real-synth-engine-v4-gate-c-private/mapping.json
          if-no-files-found: error
