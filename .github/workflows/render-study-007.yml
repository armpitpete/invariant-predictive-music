name: render-study-007

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/ipm/surface_rhythm.py"
      - "src/ipm/study7.py"
      - ".github/workflows/render-study-007.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Generate Study 007
        run: python -m ipm.study7 --output artifacts
      - name: Upload Study 007
        uses: actions/upload-artifact@v7
        with:
          name: ipm-study-007
          path: artifacts/
          if-no-files-found: error
