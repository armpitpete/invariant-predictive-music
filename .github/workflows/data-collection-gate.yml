name: data-collection-gate

on:
  pull_request:
    paths:
      - "DATA_COLLECTION.md"
      - "src/ipm/collection_control.py"
      - "tests/test_collection_control.py"
      - ".github/workflows/data-collection-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install IPM
        run: python -m pip install -e '.[dev]'

      - name: Download exact participant v3 bundle and browser evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9328095073/zip" \
            -o participant-web.zip
          echo "1e512e85fea0e90f1e03791897803a28d264be9a5c3a8569def9324a1d5364c6  participant-web.zip" | sha256sum --check --strict
          mkdir participant-web
          unzip -q participant-web.zip -d participant-web

          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9328095794/zip" \
            -o participant-gate.zip
          echo "54d802b265c29cca853f894d46be3a3ff2c4502e7b2b8f61ba1961f0f810d501  participant-gate.zip" | sha256sum --check --strict
          mkdir participant-gate
          unzip -q participant-gate.zip -d participant-gate

      - name: Verify v3 intake contract and superseded-export rejection
        env:
          IPM_PARTICIPANT_BUNDLE: participant-web
          IPM_SYNTHETIC_EXPORTS: participant-gate/participant-browser-acceptance
        run: pytest -q tests/test_collection_control.py

      - name: Run P001-P003 issuance, intake and duplicate dry-run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collection-gate/store collection-gate/exports
          python - <<'PY'
          import hashlib
          import json
          from copy import deepcopy
          from datetime import datetime, timedelta
          from pathlib import Path

          from ipm.collection_control import audit, ingest, init_store, reserve

          bundle = Path("participant-web")
          evidence = Path("participant-gate/participant-browser-acceptance")
          root = Path("collection-gate")
          db = root / "control.sqlite3"
          store = root / "store"

          config = json.loads((bundle / "config.json").read_text())
          assert config["participant_interface_source_revision"] == "e6b07579878350c80fb6548107290898b48501ca"

          init_store(db, bundle)
          for pid in ("P001", "P002", "P003"):
              reserve(db, pid, f"synthetic-{pid.lower()}", "synthetic-gate")
              ingest(db, bundle, store, evidence / f"{pid}-synthetic-export.json")

          source_path = evidence / "P001-synthetic-export.json"
          source = json.loads(source_path.read_text())
          assert source["export_version"] == 2
          assert source["participant_interface_source_revision"] == config["participant_interface_source_revision"]
          original = source["enrolled_at_utc"]
          origin = datetime.fromisoformat(original.replace("Z", "+00:00"))

          def shifted(hours):
              value = (origin + timedelta(hours=hours)).isoformat(timespec="milliseconds").replace("+00:00", "Z")
              item = deepcopy(source)
              item["enrolled_at_utc"] = value
              main = play = False
              for event in item["audit"]:
                  if event["event"] == "main_block_started" and event.get("at") == original and not main:
                      event["at"] = value
                      main = True
                  if event["event"] == "playback_started" and event.get("at") == original and not play:
                      event["at"] = value
                      play = True
              assert main and play
              return value, item

          later_at, later = shifted(1)
          earlier_at, earlier = shifted(-1)
          later_path = root / "exports/P001-later.json"
          earlier_path = root / "exports/P001-earlier.json"
          later_path.write_text(json.dumps(later, indent=2) + "\n")
          earlier_path.write_text(json.dumps(earlier, indent=2) + "\n")
          ingest(db, bundle, store, later_path)
          ingest(db, bundle, store, earlier_path)
          ingest(db, bundle, store, source_path)  # idempotent re-ingest

          report = audit(db)
          assert report["participant_count"] == 36
          assert report["reserved_or_received"] == 3
          assert report["submission_count"] == 5
          assert report["participants_with_duplicate_enrolled_submissions"] == ["P001"]
          p001 = next(row for row in report["participants"] if row["participant_id"] == "P001")
          assert p001["enrolled_submission_count"] == 3
          assert p001["canonical_enrolled_at_utc"] == earlier_at
          raw = list((store / "submissions/P001").glob("*.json"))
          assert len(raw) == 3
          assert all(path.stem == hashlib.sha256(path.read_bytes()).hexdigest() for path in raw)

          gate = {
              "gate": "researcher participant issuance and data-return control v3",
              "passed": True,
              "synthetic_nonhuman_sessions": True,
              "real_participants_recruited": 0,
              "participant_pool": "P001-P036",
              "reserved_synthetic_ids": ["P001", "P002", "P003"],
              "frozen_participant_artifact_id": 9328095073,
              "frozen_participant_artifact_sha256": "1e512e85fea0e90f1e03791897803a28d264be9a5c3a8569def9324a1d5364c6",
              "source_browser_evidence_artifact_id": 9328095794,
              "source_browser_evidence_artifact_sha256": "54d802b265c29cca853f894d46be3a3ff2c4502e7b2b8f61ba1961f0f810d501",
              "participant_interface_source_revision": config["participant_interface_source_revision"],
              "export_version": source["export_version"],
              "superseded_export_versions_rejected_by_tests": True,
              "central_reservation_required_by_tests": True,
              "content_addressed_raw_evidence_preserved": True,
              "duplicate_rule": "earliest enrolled_at_utc wins canonical; all distinct submissions retained",
              "p001_distinct_enrolled_submissions": 3,
              "p001_canonical_enrolled_at_utc": earlier_at,
              "synthetic_original_enrolled_at_utc": original,
              "synthetic_later_enrolled_at_utc": later_at,
          }
          (root / "audit.json").write_text(json.dumps(report, indent=2) + "\n")
          (root / "collection-control-gate.json").write_text(json.dumps(gate, indent=2) + "\n")
          print(json.dumps(gate, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: data-collection-control-gate-v3
          path: |
            collection-gate/*.json
            DATA_COLLECTION.md
