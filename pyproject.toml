[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-predictive-music"
version = "0.2.0"
description = "Reference implementation of the Invariant Predictive Music model"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ipm = "ipm.engine:main"
ipm-machine = "ipm.machine:main"
ipm-study = "ipm.engine:main"
ipm-study-001 = "ipm.study:main"
ipm-study-004 = "ipm.study4:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
